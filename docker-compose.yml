
services:
  orbot:
    build:
      context: .
      dockerfile: Dockerfile

    image: orbit-python:latest
    container_name: orbot

    restart: unless-stopped

    env_file:
      - ../.env

    dns:
      - 8.8.8.8
      - 1.1.1.1

    volumes:
      - ../config:/app/config
      - ../data:/app/data
      - ../logs:/app/logs

    ports:
      - "127.0.0.1:8080:8080"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true
