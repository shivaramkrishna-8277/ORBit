
name: Deploy ORBit

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package application
        run: |
          tar -czf "$RUNNER_TEMP/orbit-release.tar.gz" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='config/token.txt' \
            --exclude='data/*.db' \
            --exclude='logs/*.log' \
            -C "$GITHUB_WORKSPACE" .

          cp "$RUNNER_TEMP/orbit-release.tar.gz" \
            "$GITHUB_WORKSPACE/orbit-release.tar.gz"

          ls -lh "$GITHUB_WORKSPACE/orbit-release.tar.gz"

      - name: Transfer application to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "orbit-release.tar.gz"
          target: "/tmp"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            echo "Checking environment file..."
            test -f /opt/orbit/.env || {
              echo "ERROR: /opt/orbit/.env is missing"
              exit 1
            }

            echo "Checking deployment archive..."
            test -f /tmp/orbit-release.tar.gz

            echo "Extracting application..."
            mkdir -p /opt/orbit/app
            tar -xzf /tmp/orbit-release.tar.gz -C /opt/orbit/app

            rm -f /tmp/orbit-release.tar.gz

            cd /opt/orbit/app

            echo "Building and starting ORBit..."
            docker compose up -d --build --remove-orphans

            echo "Waiting for startup..."
            sleep 5

            echo "Container status:"
            docker ps --filter name=orbot

            echo "Recent application logs:"
            docker logs --tail 50 orbot
