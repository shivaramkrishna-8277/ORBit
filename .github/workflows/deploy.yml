
name: Deploy ORBit

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          tar -czf orbit-release.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='config/token.txt' \
            --exclude='data/*.db' \
            --exclude='logs/*.log' \
            .

      - name: Transfer application to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "orbit-release.tar.gz"
          target: "/tmp/"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            echo "Starting ORBit deployment..."

            mkdir -p /opt/orbit/app
            mkdir -p /opt/orbit/config
            mkdir -p /opt/orbit/data
            mkdir -p /opt/orbit/logs

            if [ ! -f /opt/orbit/.env ]; then
              echo "ERROR: ORBit .env file is missing"
              exit 1
            fi

            cd /opt/orbit/app

            tar -xzf /tmp/orbit-release.tar.gz

            rm -f /tmp/orbit-release.tar.gz

            docker compose up -d --build --remove-orphans

            echo "Waiting for ORBit container..."

            sleep 5

            docker ps --filter "name=orbot"

            docker logs --tail 50 orbot

            echo "ORBit deployment completed."
