# ORBit on a VPS with Cloudflare + nginx
# Domain: orbit.brancotech.in (adjust server_name)
#
# Copy into /etc/nginx/sites-available/ and enable:
#   sudo ln -s /etc/nginx/sites-available/orbit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── Required for Fyers OAuth ───────────────────────────────────────────────
# Fyers must redirect to https://orbit.brancotech.in/callback (not the site root).
# Set the same value in /opt/orbit/.env as FYERS_REDIRECT_URI and in myapi.fyers.in.
# The orbot container listens on 127.0.0.1:8080 only while login is in progress.

server {
    listen 80;
    server_name orbit.brancotech.in;

    # Cloudflare Flexible SSL: terminate TLS at Cloudflare, HTTP here.
    # Prefer Full (strict) + cert on origin when you can.

    location /callback {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8601;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}